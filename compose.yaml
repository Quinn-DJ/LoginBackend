name: tastymap-login-backend

services:
  pocketbase:
    build:
      context: .
    restart: unless-stopped
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?Set PB_ENCRYPTION_KEY in .env}
    volumes:
      - ./data:/pb_data
      - ./pb_migrations:/pb_migrations:ro
      - ./pb_hooks:/pb_hooks:ro
      - ./backups:/backups
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      TASTYMAP_DOMAIN: ${TASTYMAP_DOMAIN:?Set TASTYMAP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - egress

networks:
  backend:
    internal: true
  egress:

volumes:
  caddy_data:
  caddy_config:
